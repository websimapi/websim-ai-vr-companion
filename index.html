<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI VR Companion</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none; text-align: center;
        }
        #ui-panel {
            background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px;
            pointer-events: auto; max-width: 400px;
        }
        button {
            background: #4a90e2; color: white; border: none; padding: 12px 24px;
            font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px;
        }
        #status { font-size: 14px; margin-top: 10px; color: #aaa; }
        /* Style for the VR Button to make it blend or stand out if needed, though three.js styles it */
        .log-line { font-size: 12px; color: #0f0; text-align: left; margin-top: 5px; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="overlay">
        <div id="ui-panel">
            <h2>VR AI Companion</h2>
            <p>Quest 1-3 Compatible. Hand Tracking Required.</p>
            <p>The AI sees what you see.</p>
            <div id="status">Checking VR compatibility...</div>
        </div>
    </div>
    <script type="module" src="./src/main.js"></script>

</html>
